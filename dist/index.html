<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HomeLife - Budget, shop, and plan your household in one place." />
    <link rel="icon" type="image/svg+xml" href="/homelife/favicon.svg" />
    <title>HomeLife</title>
    <style>
      :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#eef4ff}body{margin:0}.boot{max-width:960px;margin:40px auto;padding:24px}.boot-card{background:white;border:1px solid #dbe7ff;border-radius:18px;box-shadow:0 18px 50px rgba(30,64,175,.12);padding:24px}.boot-mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#1d4ed8,#0f766e);color:white;display:grid;place-items:center;font-weight:800;margin-bottom:12px}.boot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.boot-tile{background:#f8fbff;border:1px solid #e4ecff;border-radius:14px;padding:14px}.boot-warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:14px;margin-top:18px;color:#7c2d12}code{background:#eef2ff;padding:2px 5px;border-radius:6px}
    </style>
    <script type="module" crossorigin src="/homelife/assets/index-CsJ4vw4e.js"></script>
    <link rel="stylesheet" crossorigin href="/homelife/assets/index-CJIGxsUt.css">
  </head>
  <body>
    <noscript>HomeLife requires JavaScript to run.</noscript>
    <div id="root">
      <div class="boot" id="boot-loading">
        <div class="boot-card">
          <div class="boot-mark">HL</div>
          <h1>Loading HomeLife...</h1>
          <p>Budget, shop, and plan your household in one place.</p>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function(){
        var root=document.getElementById('root');
        if(!root || root.dataset.homelifeMounted==='true') return;
        root.innerHTML = '<main class="boot"><section class="boot-card"><div class="boot-mark">HL</div><h1>HomeLife</h1><p><strong>Budget, shop, and plan your household in one place.</strong></p><p>The site shell is visible, but the React bundle has not loaded yet. This usually means GitHub Pages is serving the source files instead of the Vite build output.</p><div class="boot-grid"><div class="boot-tile"><strong>Shopping Lists</strong><br/>Grocery, Sam\'s, school, and custom lists.</div><div class="boot-tile"><strong>Price Catalog</strong><br/>Manual local pricing for close projections.</div><div class="boot-tile"><strong>Private Finance</strong><br/>Register and debt hidden by role.</div><div class="boot-tile"><strong>Statement Import</strong><br/>CSV reconciliation with sanitized rows.</div></div><div class="boot-warn"><strong>Deployment check:</strong> In GitHub, set <code>Settings → Pages → Source</code> to <code>GitHub Actions</code>, then push again. If using branch deploy, select <code>main / docs</code> after running <code>npm run build</code>.</div></section></main>';
      }, 1800);
    </script>
  </body>
</html>
