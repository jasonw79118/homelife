name: Deploy HomeLife to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homelife-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Force public npm registry and stable npm
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install -g npm@10.9.2 --registry=https://registry.npmjs.org/
          npm --version
          node --version

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install --no-audit --no-fund --prefer-online --registry=https://registry.npmjs.org/ || \
          (npm cache clean --force && npm install --no-audit --no-fund --prefer-online --registry=https://registry.npmjs.org/)

      - name: Build
        run: npm run build

      - name: Copy SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload HomeLife Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: homelife-pages
          path: dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: homelife-pages
