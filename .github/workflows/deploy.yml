name: Deploy HomeLife to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homelife-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm clean installer
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          node --version
          pnpm --version

      - name: Install dependencies from a clean workspace
        run: |
          rm -rf node_modules package-lock.json pnpm-lock.yaml "$RUNNER_TEMP/pnpm-store"
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          pnpm install --no-frozen-lockfile --prefer-offline=false

      - name: Build HomeLife
        run: pnpm run build

      - name: Verify production files
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q './assets/' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload single Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: homelife-pages
          path: dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: homelife-pages
