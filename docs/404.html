    function addShoppingItem(listId){const search=prompt('Item name? This will try to use your price catalog.');if(!search)return;const found=state.data.priceCatalog.find(p=>p.name.toLowerCase().includes(search.toLowerCase())||search.toLowerCase().includes(p.name.toLowerCase()));const price=found?found.price:Number(prompt('Estimated item price?','0')||0);const qty=Number(prompt('Quantity?','1')||1);const item={id:uid('item'),name:found?.name||search,quantity:Number.isFinite(qty)?qty:1,estimatedPrice:Number.isFinite(price)?price:0,checked:false,store:found?.store||'',category:found?.category||'',notes:found?[found.brand,found.size].filter(Boolean).join(' '):'',source:found?'price_catalog':'manual'};update({...state.data,shoppingLists:state.data.shoppingLists.map(l=>l.id===listId?{...l,items:[...(l.items||[]),item]}:l)});}
    function parseCsv(text){
      const rows=[]; let row=[], cell='', quoted=false;
      for(let i=0;i<text.length;i++){
        const ch=text[i], next=text[i+1];
        if(ch==='"' && quoted && next==='"'){ cell+='"'; i++; }
        else if(ch==='"'){ quoted=!quoted; }
        else if(ch===',' && !quoted){ row.push(cell); cell=''; }
        else if((ch==='\n' || ch==='\r') && !quoted){
          if(ch==='\r' && next==='\n') i++;
          row.push(cell);
          if(row.some(c=>String(c).trim())) rows.push(row);
          row=[]; cell='';
        } else cell+=ch;
      }
      row.push(cell);
      if(row.some(c=>String(c).trim())) rows.push(row);
      return rows;
    }
    function parseAmount(v){v=String(v||'').replace(/[$,]/g,'').trim();const neg=/\(.+\)/.test(v);const n=Number(v.replace(/[()]/g,''));return neg?-Math.abs(n):n;}
    function cleanItemName(v){return String(v||'').replace(/\b(upc|sku|tc|acct|card)\b.*$/ig,'').replace(/\b\d{8,}\b/g,'').replace(/[^a-zA-Z0-9#&% .,'/-]/g,' ').replace(/\s+/g,' ').trim().slice(0,90);}
    function sanitizeDescription(d){return String(d||'Imported transaction').replace(/\b\d{4,}\b/g,'####').replace(/acct\s*#?\s*\w+/ig,'acct ####').slice(0,90);}
    function closeDate(a,b){const da=new Date(a).getTime(),db=new Date(b).getTime();if(!Number.isFinite(da)||!Number.isFinite(db))return false;return Math.abs((da-db)/86400000)<=3;}
    function findMatch(row){return state.data.transactions.find(t=>Math.abs((+t.amount)-row.amount)<.01&&closeDate(t.date,row.date))||state.data.transactions.find(t=>Math.abs((+t.amount)-row.amount)<.01)}
    function handleStatementFile(e){const file=e.target.files?.[0];if(!file)return;file.text().then(text=>{const parsed=parseCsv(text);if(parsed.length<2){alert('No rows found. Use a CSV export from your bank.');return}const header=parsed[0].map(h=>h.toLowerCase().trim());const dateIdx=header.findIndex(h=>h.includes('date'));const descIdx=header.findIndex(h=>h.includes('description')||h.includes('memo')||h.includes('payee'));const amountIdx=header.findIndex(h=>h.includes('amount'));const debitIdx=header.findIndex(h=>h.includes('debit')||h.includes('withdrawal'));const creditIdx=header.findIndex(h=>h.includes('credit')||h.includes('deposit'));const rows=parsed.slice(1).map(cols=>{const debit=debitIdx>=0?parseAmount(cols[debitIdx]):0;const credit=creditIdx>=0?parseAmount(cols[creditIdx]):0;const amount=amountIdx>=0?parseAmount(cols[amountIdx]):(credit?Math.abs(credit):-Math.abs(debit));const row={id:uid('stmt'),date:(cols[dateIdx]||'').trim(),description:sanitizeDescription(cols[descIdx]||'Imported transaction'),amount,type:amount>=0?'credit':'debit',matchStatus:'missing_from_register'};const match=findMatch(row);return match?{...row,matchedTransactionId:match.id,matchStatus:closeDate(row.date,match.date)?'matched':'possible'}:row;}).filter(r=>r.date&&Number.isFinite(r.amount));update({...state.data,statementImports:rows});});}
    function exportStatement(){const rows=[['date','description','amount','type','matchStatus'],...state.data.statementImports.map(r=>[r.date,r.description,String(r.amount),r.type,r.matchStatus])];downloadCsv('homelife-sanitized-statement.csv',rows)}

    function parseReceiptFromScreen(){const text=app.querySelector('#receiptText')?.value||'';const store=app.querySelector('#receiptStore')?.value||'Walmart';const dt=app.querySelector('#receiptDate')?.value||today();if(!text.trim()){alert('Paste receipt/order text or upload a file first.');return}const rows=parseReceiptRows(text,store,dt);if(!rows.length){alert('I could not identify item/price rows. Try a CSV export with item, quantity, and price columns, or paste receipt text with item names and prices.');return}update({...state.data,receiptImports:rows});}
    function parseReceiptRows(text,store,dt){
      const parsed=parseCsv(text);
      if(parsed.length>1&&parsed[0].length>1){
        const header=parsed[0].map(h=>String(h).toLowerCase().trim());
        const find=(keys)=>header.findIndex(h=>keys.some(k=>h.includes(k)));
        const nameIdx=find(['item','product','description','name']);
        const qtyIdx=find(['qty','quantity']);
        const unitIdx=find(['unit','price each','unit price']);
        const totalIdx=find(['total','amount','price']);
        if(nameIdx>=0&&(unitIdx>=0||totalIdx>=0)){
          return parsed.slice(1).map(cols=>{
            const name=cleanItemName(cols[nameIdx]);
            const qty=Number(cols[qtyIdx]||1)||1;
            const total=Number(String(cols[totalIdx>=0?totalIdx:unitIdx]||'').replace(/[$,]/g,''))||0;
            const unit=unitIdx>=0?Number(String(cols[unitIdx]||'').replace(/[$,]/g,''))||total/qty:total/qty;
            return {id:uid('receipt'),date:dt,store,name,quantity:qty,unitPrice:round2(unit),totalPrice:round2(total),rawLine:cols.join(' | ').slice(0,140),status:'parsed'};
          }).filter(r=>r.name&&r.totalPrice>0);
        }
      }
      const skip=/\b(subtotal|total|tax|cash|debit|credit|change|balance|savings|visa|mastercard|walmart pay|thank you|receipt|authorization|approval|store|terminal|card|tc#|phone|return|pickup|delivery|order number)\b/i;
      const rows=[];
      String(text).split(/\r?\n/).forEach(line=>{
        const raw=line.trim();
        if(raw.length<4||skip.test(raw)) return;
        const prices=[...raw.matchAll(/\$?([0-9]+\.[0-9]{2})\b/g)].map(m=>Number(m[1])).filter(n=>n>0&&n<1000);
        if(!prices.length) return;
        const total=prices[prices.length-1];
        let name=raw.replace(/\$?[0-9]+\.[0-9]{2}\b/g,' ').replace(/\bF\b|\bT\b/g,' ');
        let qty=1;
        const qm=raw.match(/(?:qty|quantity)\s*[:x]?\s*(\d+(?:\.\d+)?)/i)||raw.match(/(\d+(?:\.\d+)?)\s*@\s*\$?[0-9]+\.[0-9]{2}/);
        if(qm) qty=Number(qm[1])||1;
        name=cleanItemName(name);
        if(name&&name.length>1) rows.push({id:uid('receipt'),date:dt,store,name,quantity:qty,unitPrice:round2(total/qty),totalPrice:round2(total),rawLine:raw.slice(0,140),status:'parsed'});
      });
      return rows;
    }
    function round2(n){return Math.round((Number(n)||0)*100)/100;}
    function receiptCatalogKey(r){return `${(r.store||'').toLowerCase()}|79015|${(r.name||'').toLowerCase()}|receipt import`;}
    function mergeReceiptToCatalog(){const rows=state.data.receiptImports||[];if(!rows.length){alert('No parsed receipt rows to merge.');return}const map=new Map(state.data.priceCatalog.map(p=>[catalogKey(p),p]));let added=0,updated=0;rows.forEach(r=>{const key=receiptCatalogKey(r);const existing=[...map.values()].find(p=>(p.store||'')===r.store&&(p.name||'').toLowerCase()===(r.name||'').toLowerCase());const item={id:existing?.id||uid('price'),store:r.store,storeZip:'79015',storeName:r.store==='Walmart'?'Walmart Supercenter #793':r.store==='United Supermarkets'?'United Supermarkets N 23rd & Russell Long':'',storeAddress:r.store==='Walmart'?'1701 N 23rd St, Canyon, TX 79015':r.store==='United Supermarkets'?'201 N 23rd St, Canyon, TX 79015':'',name:r.name,brand:existing?.brand||'Receipt import',size:existing?.size||'last purchased',category:existing?.category||'Receipt Import',price:round2(r.unitPrice),lastChecked:r.date||today(),notes:`Updated from ${r.store} order/receipt import. Last parsed total ${money(r.totalPrice)} for qty ${r.quantity}.`};if(existing){map.set(catalogKey(existing),{...existing,...item});updated++;}else{map.set(catalogKey(item),item);added++;}});update({...state.data,priceCatalog:[...map.values()]});alert(`Receipt items merged. Added ${added}; updated ${updated}.`);}
    function makeReorderList(){const rows=state.data.receiptImports||[];if(!rows.length){alert('No parsed receipt rows to build from.');return}const name=prompt('Reorder list name?','Reorder from last receipt');if(!name)return;const items=rows.map(r=>({id:uid('item'),name:r.name,quantity:r.quantity||1,estimatedPrice:r.unitPrice||0,checked:false,store:r.store,category:'Receipt Import',notes:`From receipt ${r.date}`,source:'receipt_import'}));update({...state.data,shoppingLists:[...state.data.shoppingLists,{id:uid('list'),name,type:'grocery',sharedWith:state.data.users.map(u=>u.id),items}]});}
    function exportReceiptRows(){const rows=[['date','store','name','quantity','unitPrice','totalPrice','rawLine'],...(state.data.receiptImports||[]).map(r=>[r.date,r.store,r.name,String(r.quantity),String(r.unitPrice),String(r.totalPrice),r.rawLine||''])];downloadCsv('homelife-receipt-import-cleaned.csv',rows)}
    function importJson(e){const file=e.target.files?.[0];if(!file)return;file.text().then(text=>{try{update(JSON.parse(text))}catch(err){alert('Invalid JSON backup file.')}})}
    function downloadCsv(name,rows){downloadText(name,rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'))}
    function downloadText(name,text){const blob=new Blob([text],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
    render();
  })();
  </script>
